

services:
  # =====================================
  # PostgreSQL with pgvector
  # =====================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docuchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docuchat
      POSTGRES_PASSWORD: docuchat_dev_password
      POSTGRES_DB: docuchat
    ports:
      - "${POSTGRES_PORT:-5432}:5432" # set POSTGRES_PORT if 5432 is taken on your machine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-run init scripts on first start
      - ./backend/migrations/000_init_pgvector.sql:/docker-entrypoint-initdb.d/000_init_pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuchat -d docuchat"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - docuchat-network

  # =====================================
  # Redis for job queues
  # =====================================
  redis:
    image: redis:7-alpine
    container_name: docuchat-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379" # set REDIS_HOST_PORT if 6379 is taken
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - docuchat-network

  # =====================================
  # Migrations (one-off, runs to completion before the API and worker start)
  # =====================================
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docuchat-migrate
    command: ["node", "dist/config/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: docuchat
      DB_USER: docuchat
      DB_PASSWORD: docuchat_dev_password
      DB_SSL: disable # local Postgres has no TLS; production uses DB_SSL=verify (docs/DEPLOYMENT.md)
      JWT_SECRET: dev-jwt-secret-not-for-production-use-only
      JWT_REFRESH_SECRET: dev-refresh-secret-not-for-production-use-only
    networks:
      - docuchat-network
    profiles:
      - full

  # =====================================
  # Backend service
  # =====================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docuchat-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3001

      # Database
      DATABASE_URL: postgresql://docuchat:docuchat_dev_password@postgres:5432/docuchat
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: docuchat
      DB_USER: docuchat
      DB_PASSWORD: docuchat_dev_password
      DB_SSL: disable # local Postgres has no TLS

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0

      # Auth
      JWT_SECRET: dev-jwt-secret-not-for-production-use-only
      JWT_REFRESH_SECRET: dev-refresh-secret-not-for-production-use-only
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d

      # AI provider: mock by default (no keys needed). To use a real one, put the values in a .env file
      # next to this compose file (never commit it), for example:
      #   AI_PROVIDER=anthropic  ANTHROPIC_API_KEY=...  OPENAI_API_KEY=...  MIN_SIMILARITY_THRESHOLD=0.6
      # Anthropic has no embeddings API, so embeddings still need OPENAI_API_KEY (or stay on the mock).
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-none}
      TOOLS_ENABLED: ${TOOLS_ENABLED:-false}
      # Mock provider only: pause between streamed words so the token-by-token effect is visible
      MOCK_STREAM_DELAY_MS: ${MOCK_STREAM_DELAY_MS:-30}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small

      # Vector search. 0.0 because mock embeddings are not semantic; use 0.6 with a real embedding model.
      MIN_SIMILARITY_THRESHOLD: ${MIN_SIMILARITY_THRESHOLD:-0.0}

      # CORS
      FRONTEND_URL: http://localhost:5173

      # Logging
      LOG_LEVEL: info
    ports:
      - "3001:3001"
    networks:
      - docuchat-network
    profiles:
      - full

  # =====================================
  # Worker service (for processing embeddings)
  # =====================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docuchat-worker
    restart: unless-stopped
    command: ["node", "dist/workers/start-worker.js"]
    # The image's HEALTHCHECK probes the API's HTTP port; the worker has none
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production

      # Database
      DATABASE_URL: postgresql://docuchat:docuchat_dev_password@postgres:5432/docuchat
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: docuchat
      DB_USER: docuchat
      DB_PASSWORD: docuchat_dev_password
      DB_SSL: disable # local Postgres has no TLS

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0

      # Auth settings are validated at startup in every process, workers included
      JWT_SECRET: dev-jwt-secret-not-for-production-use-only
      JWT_REFRESH_SECRET: dev-refresh-secret-not-for-production-use-only

      # AI provider (embeddings run here, so it needs the same provider settings as the API)
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small

      # Logging
      LOG_LEVEL: info
    networks:
      - docuchat-network
    profiles:
      - full

  # =====================================
  # Frontend service
  # =====================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docuchat-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - docuchat-network
    profiles:
      - full

volumes:
  postgres_data:
  redis_data:

networks:
  docuchat-network:
    driver: bridge


# ==========================================
# Usage Instructions
# ==========================================
#
# Development (Postgres + Redis only):
#   docker-compose up -d postgres redis
#   # Then run backend/frontend locally with `npm run dev`
#
# Full stack (All services):
#   docker-compose --profile full up -d
#
# Full stack with logs:
#   docker-compose --profile full up
#
# Access application:
#   Frontend:  http://localhost:5173
#   Backend:   http://localhost:3001
#   API Docs:  http://localhost:3001/api-docs (if available)
#
# View logs:
#   docker-compose logs -f [service-name]
#   docker-compose logs -f backend
#   docker-compose logs -f worker
#
# Stop services:
#   docker-compose down
#
# Stop and remove volumes (CAUTION: deletes all data):
#   docker-compose down -v
#
# Rebuild after code changes:
#   docker-compose --profile full build
#   docker-compose --profile full up -d
#
# Run only database services:
#   docker-compose up -d postgres redis
#
# Access database:
#   docker exec -it docuchat-postgres psql -U docuchat -d docuchat
#
# Access Redis CLI:
#   docker exec -it docuchat-redis redis-cli
#
# Monitor Redis queue:
#   docker exec -it docuchat-redis redis-cli KEYS "*"
#   docker exec -it docuchat-redis redis-cli LLEN "bull:embeddings:wait"
#
# ==========================================
